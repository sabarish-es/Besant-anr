<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1d38">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page Not Found | Besant StudentHub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#173253}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 900px 500px at 10% 0,#d9eafd 0,transparent 70%),linear-gradient(145deg,#f8fbff,#eef5ff)}
    .shell{width:min(100%,650px)}.brand{display:flex;align-items:center;gap:12px;font-weight:680;font-size:1rem;letter-spacing:-.035em;margin-bottom:28px}.brand img{width:44px;height:44px;object-fit:contain;padding:5px;background:white;border:1px solid #e2eaf5;border-radius:14px;box-shadow:0 5px 16px #153c7512}.brand strong{color:#2563eb}
    .card{background:#fff;padding:clamp(26px,5vw,56px);border-radius:24px;border:1px solid #dce6f4;box-shadow:0 22px 75px #264e8115;position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-60px;top:-90px;width:240px;height:240px;border-radius:50%;background:#eff6ff;pointer-events:none}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;letter-spacing:.11em;font-weight:800;color:#336db4;text-transform:uppercase;position:relative;z-index:1}.dot{width:9px;height:9px;background:#3b82f6;border-radius:50%;box-shadow:0 0 0 5px #dbeafe}.code{font-size:clamp(6rem,20vw,10rem);letter-spacing:-.1em;line-height:1;font-weight:820;color:#c8dbf6;margin:18px 0 0}h1{font-size:clamp(1.55rem,4vw,2.1rem);line-height:1.3;letter-spacing:-.04em;margin:0 0 13px}.message{line-height:1.8;font-size:.97rem;color:#61748c;max-width:480px;margin:0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:31px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border-radius:11px;font-size:.9rem;text-decoration:none;font-weight:700;border:1px solid transparent;transition:transform .15s,box-shadow .15s}.button:hover{transform:translateY(-2px)}.button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.primary{color:white;background:#2563eb;box-shadow:0 7px 20px #2563eb25}.secondary{color:#295282;background:#f5f9ff;border-color:#dbe8fa}.foot{text-align:center;font-size:.78rem;color:#8494aa;margin-top:26px}
    @media(max-width:450px){.actions .button{width:100%}.card{border-radius:18px}}@media(prefers-reduced-motion:reduce){.button{transition:none}.button:hover{transform:none}}
  </style>
</head>
<body><div class="shell">
  <header class="brand"><img src="/besant-mark.png" alt="">Besant <strong>StudentHub</strong></header>
  <main class="card"><span class="eyebrow"><span class="dot" aria-hidden="true"></span> You're off the map</span><p class="code" aria-hidden="true">404</p>
    <h1>We couldn't find that page.</h1><p class="message">The address may be incorrect, or this page may have moved. Your account and attendance records are safe.</p>
    <nav class="actions" aria-label="Page recovery"><a class="button primary" href="/">← &nbsp; Return to StudentHub</a></nav>
  </main><footer class="foot">Besant Technologies · Secure learning workspace</footer>
</div></body>
</html>
